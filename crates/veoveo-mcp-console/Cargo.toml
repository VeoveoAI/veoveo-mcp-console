[package]
name = "veoveo-mcp-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The server's public types: tool requests and results and the permission vocabulary.
# No runtime dependency.
contract = [
    "dep:chrono",
    "dep:schemars",
    "dep:serde",
    "dep:veoveo-hub-sdk",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, calls to the Hub and the log store, and the
# binary.
server = [
    "contract",
    "veoveo-hub-sdk/server",
    "dep:anyhow",
    "dep:clap",
    "dep:dotenvy",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-store",
]

[dependencies]
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
veoveo-hub-sdk = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
veoveo-hub-sdk = { workspace = true, features = ["server", "testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-console"
required-features = ["server"]

[[test]]
name = "mcp"
required-features = ["server"]

[[test]]
name = "sql_confinement"
required-features = ["server"]
