[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-console"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate.
veoveo-hub-ui = { git = "https://github.com/VeoveoAI/veoveo-hub-ui", rev = "0da3a4b6fdc8c70fe91b26ad2cab90eef2fca5c9" }
veoveo-skills = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
veoveo-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration, the forwarded identity and calls to the Hub's own
# routes for the caller.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "18a6e8c5f8a69ca57a6e12f8b752203574efa231", default-features = false }

anyhow = "=1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.11.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "1e7caf018db7eb3bed2e81023e10fc0ce58af8a5" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"
# The SDK's HTTP framework release; the tests serve a fake Hub and log store with it.
axum = "0.8.9"
# Log times, as the log store reports them.
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
