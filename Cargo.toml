[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-console"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate.
veoveo-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "d473011e5dcb840c0ca9c6dcf2df231bfeab6956" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "d473011e5dcb840c0ca9c6dcf2df231bfeab6956" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration, the forwarded identity and calls to the Hub's own
# routes for the caller.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "b2304759b07f3e1d07cd1bf9ec9a182c6dcddd65", default-features = false }

anyhow = "=1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"
# The SDK's HTTP framework release; the tests serve a fake Hub and log store with it.
axum = "0.8.9"
# Log times, as the log store reports them.
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
